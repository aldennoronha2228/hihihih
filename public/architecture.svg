<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980" role="img" aria-labelledby="title desc">
  <title id="title">WireUp project architecture</title>
  <desc id="desc">Architecture of the WireUp React hardware workspace, FastAPI backend, local JSON project storage, browser SPICE runtime, and AI providers.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="client" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123a45"/>
      <stop offset="1" stop-color="#0f2735"/>
    </linearGradient>
    <linearGradient id="api" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3d2b20"/>
      <stop offset="1" stop-color="#2a1d1b"/>
    </linearGradient>
    <linearGradient id="data" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#27364c"/>
      <stop offset="1" stop-color="#1b2638"/>
    </linearGradient>
    <linearGradient id="external" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b3154"/>
      <stop offset="1" stop-color="#241f39"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".28"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8ca3b8"/>
    </marker>
    <style>
      .title { font: 700 34px 'Segoe UI', sans-serif; fill: #f4f7fb; letter-spacing: .5px; }
      .subtitle { font: 400 15px 'Segoe UI', sans-serif; fill: #9fb2c5; }
      .section { font: 700 15px 'Segoe UI', sans-serif; fill: #dbe8f2; letter-spacing: 1.8px; }
      .boxTitle { font: 700 17px 'Segoe UI', sans-serif; fill: #f6f8fb; }
      .boxText { font: 400 13px 'Segoe UI', sans-serif; fill: #b8c7d5; }
      .edgeText { font: 600 12px 'Segoe UI', sans-serif; fill: #a9bac9; }
      .edge { stroke: #71869b; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .dash { stroke-dasharray: 7 6; }
      .node { stroke: #607489; stroke-width: 1; rx: 12; filter: url(#shadow); }
      .mini { stroke: #6e8297; stroke-width: 1; rx: 9; }
    </style>
  </defs>

  <rect width="1500" height="980" fill="url(#bg)"/>
  <circle cx="1380" cy="90" r="180" fill="#1b5360" opacity=".12"/>
  <circle cx="120" cy="900" r="240" fill="#7d4b26" opacity=".08"/>

  <text x="72" y="72" class="title">WireUp architecture</text>
  <text x="74" y="102" class="subtitle">React hardware workspace + local FastAPI coordination layer + browser analog runtime</text>
  <text x="1428" y="74" text-anchor="end" class="section">ACTIVE ROOT APP</text>

  <text x="72" y="158" class="section">CLIENT</text>
  <rect x="64" y="178" width="610" height="514" rx="18" fill="url(#client)" stroke="#2e7381" stroke-width="1.5"/>
  <text x="92" y="216" class="boxTitle">React 19 + TypeScript + Vite</text>
  <text x="92" y="242" class="boxText">Browser UI on the Vite dev server, typically port 5173</text>

  <rect class="node" x="92" y="278" width="246" height="94" fill="#164653"/>
  <text x="112" y="310" class="boxTitle">App routes</text>
  <text x="112" y="335" class="boxText">Home, projects, chat, preview</text>
  <text x="112" y="355" class="boxText">and project workspace screens</text>

  <rect class="node" x="390" y="278" width="246" height="94" fill="#164653"/>
  <text x="410" y="310" class="boxTitle">Hardware Workspace</text>
  <text x="410" y="335" class="boxText">Projects, firmware, components,</text>
  <text x="410" y="355" class="boxText">wires, runtime and instruments</text>

  <rect class="mini" x="92" y="410" width="246" height="82" fill="#102f3a"/>
  <text x="112" y="442" class="boxTitle">Schematic Canvas</text>
  <text x="112" y="467" class="boxText">Visual circuit editing and rendering</text>

  <rect class="mini" x="390" y="410" width="246" height="82" fill="#102f3a"/>
  <text x="410" y="442" class="boxTitle">Chat App</text>
  <text x="410" y="467" class="boxText">Streaming assistant conversation</text>

  <rect class="node" x="92" y="532" width="246" height="110" fill="#0d3945"/>
  <text x="112" y="564" class="boxTitle">Browser runtime</text>
  <text x="112" y="589" class="boxText">HardwareRuntime and browser</text>
  <text x="112" y="609" class="boxText">simulation session via WebSocket</text>

  <rect class="node" x="390" y="532" width="246" height="110" fill="#0d3945"/>
  <text x="410" y="564" class="boxTitle">Analog solver</text>
  <text x="410" y="589" class="boxText">solveAnalog and local SPICE WASM</text>
  <text x="410" y="609" class="boxText">for DC and transient analysis</text>

  <text x="728" y="158" class="section">LOCAL API</text>
  <rect x="720" y="178" width="430" height="514" rx="18" fill="url(#api)" stroke="#9a6845" stroke-width="1.5"/>
  <text x="748" y="216" class="boxTitle">FastAPI + Uvicorn</text>
  <text x="748" y="242" class="boxText">127.0.0.1:8000 via backend.run</text>

  <rect class="node" x="748" y="278" width="374" height="86" fill="#553522"/>
  <text x="770" y="311" class="boxTitle">Hardware API</text>
  <text x="770" y="337" class="boxText">/api/hardware projects, catalog and commands</text>

  <rect class="node" x="748" y="396" width="374" height="86" fill="#553522"/>
  <text x="770" y="429" class="boxTitle">Chat API</text>
  <text x="770" y="455" class="boxText">/api/chat NDJSON streaming responses</text>

  <rect class="node" x="748" y="514" width="374" height="110" fill="#553522"/>
  <text x="770" y="547" class="boxTitle">LangGraph agent</text>
  <text x="770" y="572" class="boxText">Validated hardware tools, project reads,</text>
  <text x="770" y="592" class="boxText">mutations, firmware and simulation actions</text>

  <text x="1204" y="158" class="section">DATA AND SERVICES</text>
  <rect x="1192" y="178" width="244" height="514" rx="18" fill="url(#data)" stroke="#5b7da5" stroke-width="1.5"/>
  <text x="1220" y="216" class="boxTitle">Local assets</text>

  <rect class="node" x="1218" y="278" width="192" height="94" fill="#304866"/>
  <text x="1238" y="310" class="boxTitle">Project JSON</text>
  <text x="1238" y="335" class="boxText">backend/data/</text>
  <text x="1238" y="355" class="boxText">hardware</text>

  <rect class="node" x="1218" y="410" width="192" height="94" fill="#304866"/>
  <text x="1238" y="442" class="boxTitle">Catalog metadata</text>
  <text x="1238" y="467" class="boxText">boards and components</text>

  <rect class="node" x="1218" y="542" width="192" height="94" fill="url(#external)"/>
  <text x="1238" y="574" class="boxTitle">AI providers</text>
  <text x="1238" y="599" class="boxText">Groq or NVIDIA</text>

  <path class="edge" d="M674 326 L748 326"/>
  <text x="687" y="314" class="edgeText">REST</text>
  <path class="edge" d="M674 457 L748 439"/>
  <text x="685" y="434" class="edgeText">NDJSON chat</text>
  <path class="edge" d="M674 585 L748 585"/>
  <text x="686" y="573" class="edgeText">WebSocket</text>
  <path class="edge" d="M1122 321 L1218 321"/>
  <text x="1140" y="309" class="edgeText">read and write</text>
  <path class="edge" d="M1122 439 L1218 439"/>
  <text x="1144" y="427" class="edgeText">read</text>
  <path class="edge dash" d="M1122 569 L1218 589"/>
  <text x="1140" y="565" class="edgeText">model calls</text>

  <rect x="64" y="750" width="1372" height="154" rx="18" fill="#101a29" stroke="#33465b"/>
  <text x="92" y="790" class="section">PRIMARY USER FLOW</text>
  <text x="92" y="832" class="boxText">1. User edits a circuit and firmware in the browser</text>
  <text x="92" y="860" class="boxText">2. Hardware API persists project state and returns catalog data</text>
  <text x="560" y="832" class="boxText">3. Agent can read, mutate, compile, and run through validated tools</text>
  <text x="560" y="860" class="boxText">4. Browser runtime executes the project and local SPICE solves the circuit</text>
  <text x="1114" y="832" class="boxText">5. Chat streams provider output</text>
  <text x="1114" y="860" class="boxText">to the active conversation</text>

  <text x="72" y="950" class="subtitle">Generated from the active root application. Vendored Velxio sources are excluded from the runtime boundary.</text>
</svg>
