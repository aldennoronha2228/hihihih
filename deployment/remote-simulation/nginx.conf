# Install in a host nginx http context after replacing the domain and TLS paths.
limit_req_zone $binary_remote_addr zone=remote_simulation:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=remote_connections:10m;

server {
    listen 80;
    server_name emulator.example.com;
    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name emulator.example.com;
    ssl_certificate /etc/letsencrypt/live/emulator.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/emulator.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 22m;
    client_body_timeout 15s;
    client_header_timeout 10s;
    access_log off;

    location / {
        limit_req zone=remote_simulation burst=10 nodelay;
        limit_conn remote_connections 16;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
}
